<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="StudyPlanner — плануйте навчальні завдання та контролюйте дедлайни."
    />
    <title>Вхід</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <link rel="stylesheet" href="css/pages/auth.css" />

    <script src="js/dates.js" defer=""></script>
    <script src="js/tasks.js" defer=""></script>
    <script src="js/storage.js" defer=""></script>
    <script src="js/selects.js" defer=""></script>
    <script src="js/modals.js" defer=""></script>
    <script src="js/forms.js" defer=""></script>
    <script src="js/filters.js" defer=""></script>
    <script src="js/render.js" defer=""></script>
    <script src="js/calendar.js" defer=""></script>
    <script src="js/auth.js" defer=""></script>
    <script src="js/navigation.js" defer=""></script>
    <script src="js/app.js" defer=""></script>
  </head>
  <body class="auth-page" data-page="login">
    <!-- icon sprite -->
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-shape-1" viewBox="0 0 24 24">
        <path d="m12 19-7-7 7-7M5 12h14"></path>
      </symbol>
      <symbol id="icon-shape-2" viewBox="0 0 24 24">
        <path d="M22 10 12 5 2 10l10 5 10-5Z"></path>
        <path d="M6 12v5c3 3 9 3 12 0v-5M22 10v6"></path>
      </symbol>
      <symbol id="icon-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 8v5M12 16h.01"></path>
      </symbol>
      <symbol id="icon-eye" viewbox="0 0 24 24">
        <path
          d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"
        ></path>
        <circle cx="12" cy="12" r="3"></circle>
      </symbol>
      <symbol id="icon-eye-off" viewbox="0 0 24 24">
        <path
          d="m2 2 20 20M10.58 10.587a2 2 0 0 0 2.828 2.83M9.88 5.09A10.75 10.75 0 0 1 21.938 11.652a1 1 0 0 1 0 .696 10.75 10.75 0 0 1-1.444 2.49M6.61 6.61a10.75 10.75 0 0 0-4.548 5.042 1 1 0 0 0 0 .696 10.75 10.75 0 0 0 14.329 5.951"
        ></path>
      </symbol>
    </svg>
    <a class="skip-link" href="#main">Перейти до форми</a>
    <!-- main content -->
    <main id="main" class="auth-layout">
      <!-- authentication -->
      <article class="auth-card" aria-labelledby="auth-title">
        <!-- header -->
        <header class="auth-card__navigation">
          <!-- main nav -->
          <nav aria-label="Навігація авторизації">
            <a
              class="button button--ghost button--icon auth-card__back"
              href="index.html"
              aria-label="Повернутися на головну"
            >
              <svg class="icon" aria-hidden="true">
                <use href="#icon-shape-1"></use>
              </svg>
            </a>
            <!-- brand -->
            <a class="brand auth-card__brand" href="index.html">
              <svg class="icon icon--large" aria-hidden="true">
                <use href="#icon-shape-2"></use>
              </svg>
              <span>StudyPlanner</span>
            </a>
          </nav>
        </header>
        <!-- header -->
        <header class="auth-card__header">
          <a
            class="auth-card__logo"
            href="index.html"
            aria-label="StudyPlanner — головна"
          >
            <svg class="icon" aria-hidden="true">
              <use href="#icon-shape-2"></use>
            </svg>
          </a>
          <h1 id="auth-title" class="auth-card__title">Вхід</h1>
          <p class="auth-card__subtitle">
            Увійдіть, щоб побачити свої завдання
          </p>
        </header>
        <div
          class="alert alert--error"
          role="alert"
          hidden=""
          data-auth-error=""
        >
          <svg class="icon" aria-hidden="true">
            <use href="#icon-info"></use>
          </svg>
          <p>Не вдалося увійти. Перевірте дані та спробуйте ще раз.</p>
        </div>
        <form
          class="auth-card__form"
          action="#main"
          method="get"
          data-auth-form="login"
          novalidate=""
        >
          <fieldset class="auth-card__fields">
            <legend class="visually-hidden">Дані для входу</legend>
            <div class="field">
              <label class="field__label" for="email">Електронна пошта</label>
              <input
                class="field__control"
                id="email"
                type="email"
                placeholder="name@example.com"
                autocomplete="email"
                required=""
                aria-describedby="email-error"
              />
              <p class="field__error" id="email-error">
                Вкажіть коректну адресу email
              </p>
            </div>
            <div class="field">
              <label class="field__label" for="password">Пароль</label>
              <div class="field__password">
                <input
                  class="field__control"
                  id="password"
                  type="password"
                  placeholder="Ваш пароль"
                  autocomplete="current-password"
                  required=""
                  aria-describedby="password-error"
                  minlength="8"
                />

                <button
                  class="field__password-toggle"
                  type="button"
                  data-password-toggle=""
                  aria-controls="password"
                  aria-pressed="false"
                  aria-label="Показати пароль"
                >
                  <svg class="icon" aria-hidden="true">
                    <use href="#icon-eye"></use>
                  </svg>
                </button>
              </div>
              <p class="field__error" id="password-error">

              </p>
            </div>
          </fieldset>
          <div class="auth-card__actions">
            <button class="button button--primary button--wide" type="submit">
              Увійти
            </button>
            <!-- footer -->
            <footer class="auth-card__footer">
              <span class="muted">Немає акаунту?</span>
              <a href="register.html">Зареєструватися</a>
            </footer>
          </div>
          <p class="visually-hidden" data-form-status="" aria-live="polite"></p>
        </form>

        <p
          class="visually-hidden"
          data-storage-status=""
          aria-live="polite"
        ></p>
      </article>
    </main>
  </body>
</html>
